[project]
name = "chart-provenance-rl"
version = "0.1.0"
description = "Controlled benchmark and online-RL study of provenance reward misspecification in chart QA"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PickHub" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pillow==12.3.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
azure = [
    "azure-ai-ml==1.35.0",
    "azure-identity==1.25.3",
]
gpu = [
    "accelerate==1.15.0",
    "azureml-mlflow==1.62.0.post6",
    "bitsandbytes==0.50.2",
    "datasets==5.0.1",
    "huggingface-hub==1.31.0",
    "mlflow==3.16.0",
    "peft==0.20.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==5.17.0",
    "trl==1.13.0",
]

[project.scripts]
chart-provenance = "chart_provenance_rl.cli:main"
chart-provenance-predict = "chart_provenance_rl.training.inference:main"
chart-provenance-train-grpo = "chart_provenance_rl.training.grpo:main"
chart-provenance-train-sft = "chart_provenance_rl.training.sft:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build==1.6.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
    "types-PyYAML==6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chart_provenance_rl"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "accelerate.*",
    "datasets.*",
    "huggingface_hub.*",
    "mlflow.*",
    "peft.*",
    "torch.*",
    "transformers.*",
    "trl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=chart_provenance_rl --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = [
    "src/chart_provenance_rl/training/grpo.py",
    "src/chart_provenance_rl/training/inference.py",
    "src/chart_provenance_rl/training/model.py",
    "src/chart_provenance_rl/training/prepare.py",
    "src/chart_provenance_rl/training/sft.py",
]
