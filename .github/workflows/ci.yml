name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: >-
          uv run
          --with 'trl==0.26.2'
          --with 'transformers==4.57.3'
          --with 'torch==2.8.0'
          pytest -q tests/test_trl_contract.py -o addopts=''
      - run: uv run chart-provenance smoke
      - run: uv run --extra azure python scripts/validate_azure_assets.py
      - run: uv build
